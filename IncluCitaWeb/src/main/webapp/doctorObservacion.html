<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IncluCita - Observación</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="doctor-observacion-page container-fluid px-2 px-sm-3">
  <div class="doctor-observacion-card">

    <div class="doctor-observacion-header d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 gap-sm-3">
      <button class="doctor-detalle-back" onclick="location.href='doctorDetallePaciente.html'">
        ← Volver a detalle
      </button>
    </div>

    <h1>Agregar observación</h1>

    <div class="doctor-paciente-head d-flex flex-column flex-sm-row align-items-center gap-3 text-center text-sm-start">
      <div class="doctor-paciente-avatar">👤</div>
      <div>
        <h2 id="obsNombre">Paciente</h2>
        <p>DNI: <span id="obsDni"></span></p>
      </div>
    </div>

    <div class="doctor-detalle-info row g-3">
      <div><strong>🩺 Especialidad:</strong><span id="obsEspecialidad"></span></div>
      <div><strong>🏥 Consultorio:</strong><span id="obsConsultorio"></span></div>
      <div><strong>📅 Fecha:</strong><span id="obsFecha"></span></div>
      <div><strong>⏰ Hora:</strong><span id="obsHora"></span></div>
    </div>

<div class="obs-form-box">

  <h3>Tipo de observación</h3>
  <p>Seleccione el tipo de información que desea registrar.</p>

<div class="obs-tipos-grid row g-3">
    <button id="btnObsGeneral" class="obs-tipo-btn active"
        onclick="toggleTipoObs('general')">
  📋
  <span>Observación<br>General</span>
</button>

<button id="btnObsDiagnostico" class="obs-tipo-btn"
        onclick="toggleTipoObs('diagnostico')">
  💙
  <span>Diagnóstico</span>
</button>

<button id="btnObsMedicamentos" class="obs-tipo-btn"
        onclick="toggleTipoObs('medicamentos')">
  💊
  <span>Medicamentos</span>
</button>
  </div>

<div id="contenedorTextosObs"></div>

  <button class="btn-imprimir-observacion" onclick="imprimirObservacionDoctor()">
    🖨️ Imprimir observación
  </button>

</div>

  </div>

  <div class="doctor-detalle-footer">
    La observación quedará registrada en el historial del paciente
  </div>
</div>
<div id="printAreaObs"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
