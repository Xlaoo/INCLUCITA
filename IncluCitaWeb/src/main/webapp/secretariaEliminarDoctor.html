<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eliminar Doctor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="pacientes-doctor-page container-fluid px-2 px-sm-3">
  <div class="pacientes-doctor-card">

    <div class="pacientes-doctor-header d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 gap-sm-3">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Secretaria</div>
        </div>
      </div>

      <button class="back-btn-citas" onclick="location.href='secretariaMenu.html'">
        ← Volver
      </button>
    </div>

    <h1>Eliminar Doctor</h1>
    <p class="pacientes-doctor-subtitle">
      Seleccione el doctor que desea eliminar del sistema.
    </p>

    <div class="doctor-search-box">
      <input
        type="text"
        id="buscarDoctorEliminar"
        placeholder="Buscar doctor por nombre o especialidad..."
        oninput="buscarDoctorEliminar()">
      <span>🔍</span>
    </div>

    <div id="listaDoctoresEliminar" class="lista-doctores-pacientes"></div>

    <button class="btn-eliminar-doctor-final" onclick="eliminarDoctorSeleccionado()">
      🗑️ Eliminar Doctor
    </button>

  </div>

  <div class="pacientes-doctor-footer">
    🗑️ Seleccione un doctor y elimínelo del sistema
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
