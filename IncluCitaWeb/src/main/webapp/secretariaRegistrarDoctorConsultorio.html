<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultorios y Horario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="registrar-doctor-page container-fluid px-2 px-sm-3">

  <div class="registrar-doctor-card">

    <div class="registrar-doctor-header d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 gap-sm-3">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Registrar Doctor</div>
        </div>
      </div>
    </div>

    <div class="registrar-step">
      <span class="done">✓</span>
      <div></div>
      <span class="done">✓</span>
      <div></div>
      <span class="active">3</span>
    </div>

    <h1>Consultorios y Horario</h1>

    <div class="form-doctor">

      <label>Asignar Consultorio</label>
      <select id="nuevoDoctorConsultorio">
        <option value="">Seleccionar consultorio disponible</option>
      </select>

      <div class="info-consultorio">
        ℹ️ Solo se muestran consultorios disponibles
      </div>

      <label>Horario de Atención</label>

      <div class="horario-grid">
        <div>
          <small>Hora de inicio</small>
          <input id="horaInicioDoctor" type="time" value="08:00">
        </div>

        <div>
          <small>Hora de fin</small>
          <input id="horaFinDoctor" type="time" value="17:00">
        </div>
      </div>

      <label>Días de atención</label>

      <div class="dias-atencion">
        <button type="button" class="dia-btn active" onclick="toggleDiaDoctor(this,'Lun')">Lun</button>
        <button type="button" class="dia-btn active" onclick="toggleDiaDoctor(this,'Mar')">Mar</button>
        <button type="button" class="dia-btn active" onclick="toggleDiaDoctor(this,'Mié')">Mié</button>
        <button type="button" class="dia-btn active" onclick="toggleDiaDoctor(this,'Jue')">Jue</button>
        <button type="button" class="dia-btn active" onclick="toggleDiaDoctor(this,'Vie')">Vie</button>
        <button type="button" class="dia-btn" onclick="toggleDiaDoctor(this,'Sáb')">Sáb</button>
        <button type="button" class="dia-btn" onclick="toggleDiaDoctor(this,'Dom')">Dom</button>
      </div>

      <div class="info-consultorio">
        ℹ️ El horario seleccionado será el horario habitual de atención del doctor.
      </div>

      <div class="registro-doctor-buttons">
        <button onclick="location.href='secretariaRegistrarDoctorEspecialidad.html'">
          ← Anterior
        </button>

        <button onclick="guardarConsultorioHorarioDoctor()">
          Siguiente →
        </button>
      </div>

    </div>

  </div>

  <div class="registrar-doctor-footer">
    Asigne consultorio y horario de atención
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
