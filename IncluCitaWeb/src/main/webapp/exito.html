<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IncluCita - Cita confirmada</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="app container-fluid px-2 px-sm-3">

    <section id="screen-success" class="screen active">
      <div class="top">
  <div class="brand">
    <div class="logo">♡</div>
    <div>
      <div class="brand-title">IncluCita</div>
      <div class="brand-subtitle">Plataforma de citas médica inclusiva</div>
    </div>
  </div>
</div>
<div class="content success-content">
  <div class="confetti">
    <span>◆</span>
    <span>✦</span>
    <span>◆</span>
    <span>✦</span>
    <span>◆</span>
  </div>

  <div class="success-icon">✓</div>

  <h1>¡Cita confirmada!</h1>

  <div class="message-box">
    Su cita ha sido registrada correctamente.
  </div>

  <p class="success-text">Se imprimirá su comprobante.</p>

  <div class="printer">🖨️</div>

  <div style="margin-top:25px;">
    <button class="main-btn" style="width:100%;" onclick="goTo('screen-ticket')">
      Ver comprobante
    </button>
  </div>
</div>

      <div class="footer-note">Por favor, retire su comprobante</div>
    </section>

</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
