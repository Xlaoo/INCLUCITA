<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IncluCita - Mi Agenda</title>
<script>
  // Impide abrir esta página interna del doctor sin haber iniciado sesión
  // con su DNI. Se ejecuta antes de pintar el contenido para no mostrarlo
  // ni un instante si no hay sesión activa.
  if (!localStorage.getItem("doctorLogueadoDni")) {
    window.location.replace("DoctorLogin.html");
  }
</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="doctor-agenda-page container-fluid px-2 px-sm-3">

  <div class="doctor-agenda-card">

    <div class="doctor-agenda-header d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 gap-sm-3">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Doctor</div>
        </div>
      </div>

      <button class="doctor-detalle-back" onclick="location.href='doctorMenu.html'">
        ← Volver al menú
      </button>
    </div>

    <h1>📅 Mi Agenda</h1>
    <p class="doctor-agenda-subtitle">
      Seleccione la fecha para ver su horario de consultorios y citas
    </p>

   <div class="doctor-agenda-content row g-4 align-items-stretch">

      <div class="agenda-calendar-box col-12 col-lg-7">
        <div class="agenda-calendar-header">
          <button onclick="cambiarMesAgenda(-1)">‹</button>
          <h2 id="agendaMesTexto">Junio 2026</h2>
          <button onclick="cambiarMesAgenda(1)">›</button>
        </div>

        <div class="agenda-weekdays">
          <span>Lun</span>
          <span>Mar</span>
          <span>Mié</span>
          <span>Jue</span>
          <span>Vie</span>
          <span>Sáb</span>
          <span>Dom</span>
        </div>

        <div id="agendaDias" class="agenda-days"></div>
      </div>

      <div class="agenda-selected-box col-12 col-lg-5">
        <p>Fecha seleccionada</p>

        <div class="agenda-date-icon">📅</div>

        <h2 id="agendaFechaSeleccionada">Seleccione un día</h2>
        <span id="agendaDiaSemana">---</span>

        <button class="btn-ver-agenda-dia" onclick="verAgendaDelDia()">
          Ver mi agenda del día
        </button>
      </div>

    </div>

    <div class="doctor-info-box agenda-info">
      <div class="doctor-info-icon">i</div>
      <div>
        Aquí puede ver su horario de consultorios y las citas programadas.
      </div>
    </div>

  </div>

  <div class="doctor-menu-footer">
    👆 Seleccione una fecha para revisar su agenda
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
