<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar Envío</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="confirmar-envio-page container-fluid px-2 px-sm-3">

  <div class="confirmar-envio-card">

    <div class="confirmar-envio-header">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Secretaria</div>
        </div>
      </div>
    </div>

    <h2>Confirmar Envío</h2>
    <p class="confirmar-envio-subtitle">
      ¿Está seguro de enviar las citas seleccionadas al doctor?
    </p>

    <div class="confirmar-envio-info">

      <div class="confirmar-envio-row">
        <div class="confirmar-icon">👤</div>
        <div>
          <strong>Doctor</strong>
          <span id="confEnvioDoctor">Dr. Doctor</span>
          <small id="confEnvioEspecialidad">Especialidad</small>
        </div>
      </div>

      <div class="confirmar-envio-row">
        <div class="confirmar-icon">📅</div>
        <div>
          <strong>Fecha</strong>
          <span id="confEnvioFecha">Fecha seleccionada</span>
        </div>
      </div>

      <div class="confirmar-envio-row">
        <div class="confirmar-icon">🗓️</div>
        <div>
          <strong>Citas seleccionadas</strong>
          <span id="confEnvioCantidad">0 citas</span>
        </div>
      </div>

    </div>

    <div class="confirmar-envio-buttons">
      <button class="btn-cancelar-envio" onclick="location.href='secretariaEnviarDia.html'">
        Cancelar
      </button>

      <button class="btn-confirmar-envio" onclick="location.href='secretariaEnvioProceso.html'">
        Enviar Citas
      </button>
    </div>

  </div>

  <div class="confirmar-envio-footer">
    Confirme el envío de las citas
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
