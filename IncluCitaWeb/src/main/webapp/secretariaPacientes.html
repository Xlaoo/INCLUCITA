<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar Paciente</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="buscar-paciente-page container-fluid px-2 px-sm-3">

  <div class="buscar-paciente-card">

    <div class="buscar-paciente-header">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Buscar Paciente</div>
        </div>
      </div>

      <button class="back-btn-citas" onclick="location.href='secretariaMenu.html'">
        ← Volver
      </button>
    </div>

    <h1>Buscar Paciente</h1>

    <label>Buscar por DNI o nombre</label>

    <div class="buscar-paciente-input">
      <input
        id="buscarPacienteInput"
        type="text"
        placeholder="Ingrese DNI o nombre del paciente"
        oninput="buscarPacientesSecretaria()">
      <span>🔍</span>
    </div>

    <div id="listaPacientesSecretaria" class="lista-pacientes-secretaria"></div>

    <div class="pacientes-pagination">
      <span id="pacientesInfo">Mostrando 0 pacientes</span>

      <div id="pacientesPagination" class="pacientes-pages"></div>
    </div>

  </div>

  <div class="buscar-paciente-footer">
    Seleccione un paciente para ver su información
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
