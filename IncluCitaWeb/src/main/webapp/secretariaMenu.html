<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IncluCita - Menú Secretaria</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="secretaria-menu-page container-fluid px-2 px-sm-3">

  <div class="secretaria-menu-card">


    <div class="secretaria-menu-header d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 gap-sm-3">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Secretaria</div>
        </div>
      </div>
    </div>
        <button class="secretaria-back-menu-btn" onclick="location.href='SecretariaLogin.html'">
  ← Regresar
</button>

    <h1>¡Bienvenida, Secretaria!</h1>
    <p class="menu-subtitle">Seleccione una opción para continuar</p>

    <div class="secretaria-options">

      <button class="secretaria-option opcion-azul" onclick="location.href='secretariaCitas.html'">
        <div class="option-icon">📋</div>
        <h3>Gestión de Citas</h3>
        <p>Administre, consulte y controle todas las citas programadas.</p>
      </button>

      <button class="secretaria-option opcion-verde" onclick="location.href='secretariaPacientes.html'">
        <div class="option-icon">👥</div>
        <h3>Pacientes</h3>
        <p>Busque, registre y gestione la información de los pacientes.</p>
      </button>

      <button class="secretaria-option opcion-morado" onclick="location.href='secretariaEnviarCitas.html'">
        <div class="option-icon">📤</div>
        <h3>Enviar Citas<br>a Doctores</h3>
        <p>Asigne y envíe las citas programadas a cada doctor.</p>
      </button>

      <button class="secretaria-option opcion-turquesa" onclick="location.href='secretariaPacientesDoctor.html'">
        <div class="option-icon">🩺</div>
        <h3>Pacientes del Doctor</h3>
        <p>Ver la lista de pacientes asignados a cada doctor para el día de hoy.</p>
      </button>

      <button class="secretaria-option opcion-naranja" onclick="location.href='secretariaRegistrarDoctor.html'">
        <div class="option-icon">👨‍⚕️</div>
<h3>Ver o Registrar Doctor</h3>
<p>Consulte los doctores registrados o agregue un nuevo doctor al sistema.</p>
      </button>

<button class="secretaria-option opcion-eliminar" onclick="location.href='secretariaEliminarDoctor.html'">
  <div class="option-icon">🗑️</div>
  <h3>Eliminar Doctor</h3>
  <p>Elimine doctores registrados y libere su consultorio asignado.</p>
</button>

<button class="secretaria-option opcion-dashboard" onclick="location.href='secretariaDashboard.html'">
  <div class="option-icon">📊</div>
  <h3>Dashboard</h3>
  <p>Vea el estado general de las citas: atendidas, pendientes y no atendidas.</p>
</button>

    </div>

    <div class="secretaria-info-box">
      <div class="info-icon">i</div>
      <div>
        <strong>Todas las citas están confirmadas.</strong>
        <p>Desde aquí puede gestionarlas de manera eficiente.</p>
      </div>
    </div>

  </div>

  <div class="secretaria-menu-footer">
    👆 Toque la opción que desea realizar
  </div>

</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
