<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IncluCita - Detalle del Paciente</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="doctor-detalle-page container-fluid px-2 px-sm-3">

  <div class="doctor-detalle-card">

    <div class="doctor-detalle-header d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 gap-sm-3">
      <button class="doctor-detalle-back" onclick="location.href='doctorPacientesHoy.html'">
        ← Volver a pacientes
      </button>
    </div>

    <div class="doctor-paciente-head d-flex flex-column flex-sm-row align-items-center gap-3 text-center text-sm-start">
      <div class="doctor-paciente-avatar">👤</div>
      <div>
        <h1 id="docDetNombre">Paciente</h1>
        <p>DNI: <span id="docDetDni"></span></p>
      </div>
    </div>

    <div class="doctor-detalle-info row g-3">
      <div><strong>🩺 Especialidad:</strong><span id="docDetEspecialidad"></span></div>
      <div><strong>🏥 Consultorio:</strong><span id="docDetConsultorio"></span></div>
      <div><strong>📅 Fecha:</strong><span id="docDetFecha"></span></div>
      <div><strong>⏰ Hora:</strong><span id="docDetHora"></span></div>
      <div><strong>📌 Estado:</strong><span class="estado-pendiente">Pendiente</span></div>
    </div>

    <div class="doctor-acciones-box">
      <h3>Acciones</h3>

      <button class="btn-observacion" onclick="location.href='doctorObservacion.html'">
        💬 Agregar observación
      </button>
    </div>

  </div>

  <div class="doctor-detalle-footer">
    Revise los datos del paciente
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
