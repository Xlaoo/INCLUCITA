<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Nuevo Doctor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="registrar-doctor-page container-fluid px-2 px-sm-3">

  <div class="registrar-doctor-card">

    <div class="registrar-doctor-header d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 gap-sm-3">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Registrar Doctor</div>
        </div>
      </div>

      <button class="back-btn-citas" onclick="location.href='secretariaMenu.html'">
        ← Volver
      </button>
    </div>
<div class="ver-doctores-area">
  <button class="btn-ver-doctores" onclick="mostrarDoctoresRegistrados()">
    👁️ Ver doctores registrados
  </button>
</div>
    <div class="registrar-step">
      <span class="active">1</span>
      <div></div>
      <span>2</span>
      <div></div>
      <span>3</span>
    </div>

    <h1>Información del Doctor</h1>

<div class="doctor-avatar" id="avatarDoctor">
    👨‍⚕️
</div>

<div class="campo-genero">
    <label>Género</label>

    <select id="doctorGenero" onchange="cambiarAvatarDoctor()">
        <option value="">Seleccione</option>
        <option value="M">Masculino</option>
        <option value="F">Femenino</option>
    </select>
</div>

    <div class="form-doctor">

      <label>Nombres</label>
      <input id="nuevoDoctorNombres" type="text" placeholder="Ej: Luis Alberto">

      <label>Apellidos</label>
      <input id="nuevoDoctorApellidos" type="text" placeholder="Ej: Ramírez Gómez">

      <label>DNI</label>
      <input id="nuevoDoctorDni" type="text" maxlength="8" placeholder="Ej: 72527818">

      <label>Teléfono / Celular</label>
      <div class="input-phone">
        <input id="nuevoDoctorTelefono" type="text" maxlength="9" placeholder="Ej: 987 654 321">
        <span>📞</span>
      </div>

      <button class="btn-siguiente-doctor" onclick="guardarDatosDoctorPaso1()">
        Siguiente →
      </button>

    </div>

  </div>

  <div class="registrar-doctor-footer">
    👆 Ingrese los datos personales del doctor
  </div>
</div>
<div id="modalDoctoresRegistrados" class="modal-doctores-bg">
  <div class="modal-doctores-box">
    <button class="modal-doctores-close" onclick="cerrarModalDoctores()">✕</button>

    <h2>Doctores Registrados</h2>
    <p>Seleccione un doctor para ver su información completa.</p>

    <div id="listaDoctoresRegistrados" class="lista-doctores-registrados"></div>
  </div>
</div>

<div id="modalDetalleDoctor" class="modal-doctores-bg">
  <div class="modal-doctores-box detalle-doctor-box">
    <button class="modal-doctores-close" onclick="cerrarDetalleDoctor()">✕</button>

    <div id="detalleDoctorContenido"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
