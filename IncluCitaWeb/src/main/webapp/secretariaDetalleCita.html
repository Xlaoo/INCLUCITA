<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle de la Cita</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="detalle-page container-fluid px-2 px-sm-3">

    <div class="detalle-card">

        <div class="detalle-header">
            <div class="brand">
                <div class="logo">♡</div>

                <div>
                    <div class="brand-title">IncluCita</div>
                    <div class="brand-subtitle">
                        Detalle de la Cita
                    </div>
                </div>
            </div>

            <span class="estado-detalle">
                Cita confirmada
            </span>
        </div>

        <button class="back-btn-citas"
                onclick="location.href='secretariaCitas.html'">
            ← Volver
        </button>

       <div class="detalle-table table-responsive">

    <div class="detalle-row">
        <strong>👤 Paciente</strong>
        <span id="detalleNombre"></span>
    </div>

    <div class="detalle-row">
        <strong>🪪 DNI</strong>
        <span id="detalleDni"></span>
    </div>

    <div class="detalle-row">
        <strong>⚕️ Especialidad</strong>
        <span id="detalleEspecialidad"></span>
    </div>

    <div class="detalle-row">
        <strong>👨‍⚕️ Médico</strong>
        <span id="detalleDoctor"></span>
    </div>

    <div class="detalle-row">
        <strong>🏥 Consultorio</strong>
        <span id="detalleConsultorio"></span>
    </div>

    <div class="detalle-row">
        <strong>📅 Fecha</strong>
        <span id="detalleFecha"></span>
    </div>

    <div class="detalle-row">
        <strong>🕘 Hora</strong>
        <span id="detalleHora"></span>
    </div>

    <div class="detalle-row">
        <strong>✔ Estado</strong>
<span id="detalleEstado" class="estado-confirmada">
    Confirmada
</span>
    </div>

</div>

        <div class="detalle-botones">

<button class="btn-reprogramar" onclick="location.href='secretariaReprogramar.html'">
    📅 Reprogramar Cita
</button>

<button class="btn-cancelar" onclick="location.href='secretariaCancelar.html'">
    ❌ Cancelar Cita
</button>


        </div>
<div class="detalle-footer">
    Verifique los datos de la cita
</div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
