<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IncluCita - Especialidad</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="app container-fluid px-2 px-sm-3">

    <section id="screen-specialty" class="screen active">
      <div class="top">
  <div class="brand">
    <div class="logo">♡</div>
    <div>
      <div class="brand-title">IncluCita</div>
      <div class="brand-subtitle">Plataforma de citas médica inclusiva</div>
    </div>
  </div>
</div>
      <div class="content">
        <div class="header-line">
          <button class="back-btn" onclick="goTo('screen-dni')">← Volver</button>
        </div>

        <div class="step-bar">
          <div class="step active-step">1</div><div class="line"></div>
          <div class="step">2</div><div class="line"></div>
          <div class="step">3</div>
        </div>

        <h2>Seleccione la especialidad</h2>

        <div class="options-grid">
          <button class="option-card" onclick="selectSpecialty('Medicina General')">
            <div class="icon">♥</div>Medicina General
          </button>

          <button class="option-card" onclick="selectSpecialty('Pediatría')">
            <div class="icon">👶</div>Pediatría
          </button>

          <button class="option-card" onclick="selectSpecialty('Traumatología')">
            <div class="icon">🦴</div>Traumatología
          </button>

          <button class="option-card" onclick="selectSpecialty('Oftalmología')">
            <div class="icon">👁</div>Oftalmología
          </button>

          <button class="option-card" onclick="selectSpecialty('Odontología')">
            <div class="icon">🦷</div>Odontología
          </button>

          <button class="option-card" onclick="showOtherSpecialties()">
          <div class="icon">•••</div>Otras especialidades
          </button>
        </div>
        <div id="otherSpecialtiesBox" class="other-specialties-box">
  <h3>Otras especialidades disponibles</h3>
  <div id="especialidadesOtras" class="options-grid"></div>
</div>
      </div>
      <div class="footer-note">Toque la especialidad que necesita</div>
    </section>

</div>

<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
