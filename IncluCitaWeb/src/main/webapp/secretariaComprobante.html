<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IncluCita - Comprobante Secretaria</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="app container-fluid px-2 px-sm-3">

<section class="screen active">

  <div class="top">
    <div class="brand">
      <div class="logo">♡</div>
      <div>
        <div class="brand-title">IncluCita</div>
        <div class="brand-subtitle">Comprobante de cita reprogramada</div>
      </div>
    </div>
  </div>

  <div class="content">

    <button class="back-btn" onclick="location.href='secretariaMenu.html'">
      ← Volver al Menú
    </button>

    <h2>Vista previa del comprobante</h2>

   <button class="print-btn" onclick="imprimirComprobanteSecretaria()">
      🖨️ Imprimir comprobante
    </button>

    <div class="ticket-preview">

      <div class="ticket ticket-modern" id="printArea">

        <div class="ticket-header">
          <div class="ticket-logo">♡</div>
          <div>
            <strong style="font-size:18px;">IncluCita</strong><br>
            <small>Comprobante de cita reprogramada</small>
          </div>
        </div>

        <div class="ticket-body">
          <div class="ticket-column">
            <p><strong>Paciente:</strong><br><span id="compPaciente"></span></p>
            <p><strong>DNI:</strong><br><span id="compDni"></span></p>
            <p><strong>Acción:</strong><br><span>Cita reprogramada</span></p>
            <p><strong>Especialidad:</strong><br><span id="compEspecialidad"></span></p>
          </div>

          <div class="ticket-column ticket-right">
            <p><strong>Médico:</strong><br><span id="compDoctor"></span></p>
            <p><strong>Consultorio:</strong><br><span id="compConsultorio"></span></p>
            <p><strong>Nueva Fecha:</strong><br><span id="compFecha"></span></p>
            <p><strong>Nueva Hora:</strong><br><span id="compHora"></span></p>
          </div>
        </div>

        <hr>

        <p style="text-align:center;">
          <strong>💙 ¡Gracias por confiar en nosotros!</strong>
        </p>

      </div>

    </div>

  </div>

  <div class="footer-note">
    Toque "Imprimir comprobante"
  </div>

</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
