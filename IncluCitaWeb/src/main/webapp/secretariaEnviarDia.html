<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ver Citas del Día</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="enviar-dia-page container-fluid px-2 px-sm-3">

  <div class="enviar-dia-card">

    <div class="enviar-dia-header">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Secretaria</div>
        </div>
      </div>

      <button class="back-btn-citas" onclick="location.href='secretariaEnviarDetalle.html'">
        ← Volver
      </button>
    </div>

    <h2 id="doctorDiaNombre">Dr. Doctor</h2>
    <div id="doctorDiaEspecialidad" class="doctor-especialidad"></div>
    <p id="fechaDiaTexto">Fecha seleccionada</p>

<div class="resumen-envio resumen-envio-dos">
  <div>
    <strong id="totalProgramadas">0</strong>
    <span>Citas Programadas</span>
  </div>

  <div>
    <strong id="totalPendientes">0</strong>
    <span>Pendientes</span>
  </div>
</div>

    <h3 class="titulo-seleccion">Seleccionar Citas</h3>
    <p class="texto-seleccion">Marque las citas que desea enviar al doctor.</p>

    <label class="seleccionar-todas-box">
      <input type="checkbox" id="checkTodasEnvio" onchange="seleccionarTodasCitasEnvio()">
      Seleccionar todas
    </label>

    <div id="listaCitasEnviarDia" class="lista-citas-enviar-dia"></div>

    <div class="contador-seleccion">
      <span id="contadorSeleccionadas">0 citas seleccionadas</span>
    </div>

    <button class="btn-enviar-citas-doctor" onclick="irConfirmarEnvioDoctor()">
      Enviar citas al doctor
    </button>

  </div>

  <div class="enviar-dia-footer">
    Seleccione pacientes para enviar
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
