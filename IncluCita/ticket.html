<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IncluCita - Comprobante</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <section id="screen-ticket" class="screen active">
      <div class="top">
  <div class="brand">
    <div class="logo">♡</div>
    <div>
      <div class="brand-title">IncluCita</div>
      <div class="brand-subtitle">Plataforma de citas médica inclusiva</div>
    </div>
  </div>
</div>
      <div class="content">

        <button class="back-btn" onclick="resetSystem()">
          ← Volver al inicio
        </button>

        <h2>Vista previa del comprobante</h2>

        <button class="print-btn" onclick="fakePrint()">
          🖨️ Imprimir comprobante
        </button>

        <div class="ticket-preview">
<div class="ticket ticket-modern" id="printArea">

  <div class="ticket-header">
    <div class="ticket-logo">♡</div>
    <div>
      <strong style="font-size:18px;">IncluCita</strong><br>
      <small>Plataforma de citas médica inclusiva</small>
    </div>
  </div>

  <div class="ticket-body">
    <div class="ticket-column">
      <p><strong>Paciente:</strong><br><span id="ticketPatient"></span></p>
      <p><strong>DNI:</strong><br><span id="ticketDni"></span></p>
      <p><strong>Especialidad:</strong><br><span id="ticketSpecialty"></span></p>
      <p><strong>Médico:</strong><br><span id="ticketDoctor"></span></p>
    </div>

    <div class="ticket-column ticket-right">
      <p><strong>Consultorio:</strong><br><span id="ticketConsultorio"></span></p>
      <p><strong>Fecha:</strong><br><span id="ticketDate"></span></p>
      <p><strong>Hora:</strong><br><span id="ticketTime"></span></p>


    </div>
  </div>

  <hr>

  <p style="text-align:center;">
    <strong>💙 ¡Gracias por confiar en nosotros!</strong>
  </p>

</div>


        </div>

      </div>

      <div class="footer-note">
        Toque "Imprimir comprobante"
      </div>

    </section>

</div>
<div id="toast" class="toast"></div>

<script src="script.js"></script>

</body>
</html>
