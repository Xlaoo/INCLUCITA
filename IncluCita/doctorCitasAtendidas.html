<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IncluCita - Citas Atendidas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="doctor-atendidas-page container-fluid px-2 px-sm-3">
  <div class="doctor-atendidas-card">

    <div class="doctor-atendidas-header d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 gap-2 gap-sm-3">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Doctor</div>
        </div>
      </div>

      <button class="doctor-detalle-back" onclick="location.href='doctorMenu.html'">
        ← Volver al menú
      </button>
    </div>

    <h1>Historial de citas atendidas</h1>

    <div class="tabla-atendidas table-responsive">
      <div class="fila-atendida encabezado">
        <span>Paciente</span>
        <span>Fecha</span>
        <span>Hora</span>
        <span>Especialidad</span>
        <span>Consultorio</span>
        <span></span>
      </div>

      <div id="listaCitasAtendidasDoctor"></div>
    </div>

  </div>

  <div class="doctor-atendidas-footer">
    Toque el ícono para ver o imprimir el comprobante de la cita
  </div>
</div>

<div id="printAreaObs"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
