<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IncluCita - Secretaria</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="secretaria-page">

  <div class="secretaria-top">
    <div class="brand">
      <div class="logo">♡</div>
      <div>
        <div class="brand-title">IncluCita</div>
        <div class="brand-subtitle">Plataforma de citas médica inclusiva</div>
      </div>
    </div>
  </div>

  <div class="secretaria-login-layout">
    <button class="secretaria-back-btn"
        onclick="location.href='pantallaPrincipal.html'">
    ← Regresar
</button>

    <div class="secretaria-left">
      <img src="SecretariaImg/SecretariaPortada.png" alt="Secretaria" class="secretaria-portada">
    </div>

    <div class="secretaria-login-card">

      <div class="secretaria-logo-box">
        <img src="SecretariaImg/SecretariaLogo.png" alt="Secretaria">
      </div>

      <h2>Ingreso Secretaria</h2>
      <p>Inicie sesión para continuar</p>

      <label>DNI</label>
      <div class="input-group">
        <input type="text" id="dniSecretaria" placeholder="Ingrese su DNI" maxlength="8">
        <span>🪪</span>
      </div>

      <label>Contraseña</label>
      <div class="input-group">
        <input type="password" id="passwordSecretaria" placeholder="Ingrese su contraseña">
        <span class="eye-password" onclick="verPasswordSecretaria()">👁</span>
      </div>

      <button class="login-btn" onclick="loginSecretaria()">Ingresar</button>

      <a href="#" class="forgot-link" onclick="mostrarRecuperacion()">¿Olvidó su contraseña?</a>

      <div id="recuperarBox" class="recuperar-box">
        <h3>Recuperar contraseña</h3>

        <input type="text" id="dniRecuperacion" placeholder="Ingrese su DNI" maxlength="8">
        <input type="password" id="nuevaClave" placeholder="Nueva contraseña">
        <input type="password" id="confirmarClave" placeholder="Confirmar contraseña">

        <button onclick="cambiarPassword()">Guardar contraseña</button>
      </div>

    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
