<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Especialidades del Doctor</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="registrar-doctor-page">

  <div class="registrar-doctor-card">

<div class="registrar-doctor-header">
  <div class="brand">
    <div class="logo">♡</div>
    <div>
      <div class="brand-title">IncluCita</div>
      <div class="brand-subtitle">Registrar Doctor</div>
    </div>
  </div>
</div>

<div class="registrar-step">
      <span class="done">✓</span>
      <div></div>
      <span class="active">2</span>
      <div></div>
      <span>3</span>
    </div>

    <h1>Especialidades</h1>

    <div class="especialidad-asignada-box">
      <h3>Especialidad asignada</h3>
      <div id="especialidadAsignada" class="especialidad-asignada-vacia">
        Primero agregue una nueva especialidad
      </div>
    </div>

    <button class="btn-agregar-especialidad" onclick="mostrarNuevaEspecialidad()">
      + Agregar Especialidad
    </button>

    <div id="boxNuevaEspecialidad" class="box-nueva-especialidad">
   <label>Nueva especialidad</label>
<input id="inputNuevaEspecialidad"
       type="text"
       placeholder="Ej: Rehabilitación Física">

<label>Emoji de la especialidad</label>
<input id="inputIconoEspecialidad"
       type="text"
       maxlength="4"
       placeholder="Ej: 🩺"
       oninput="bloquearImagenEspecialidad()">

<label>Imagen de la especialidad</label>
<input id="inputImagenEspecialidad"
       type="file"
       accept="image/*"
       onchange="bloquearEmojiEspecialidad()">

<button class="btn-guardar-nueva-especialidad" onclick="guardarNuevaEspecialidad()">
  <span>＋</span>
  Agregar Nueva Especialidad
</button>
    </div>

    <div class="registro-doctor-buttons">
      <button onclick="location.href='secretariaRegistrarDoctor.html'">
        ← Anterior
      </button>

      <button onclick="guardarEspecialidadDoctor()">
        Siguiente →
      </button>
    </div>

  </div>

  <div class="registrar-doctor-footer">
    Agregue una o más especialidades
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
