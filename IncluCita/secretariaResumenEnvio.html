<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumen de Envío</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="resumen-envio-page">

  <div class="resumen-envio-card">

    <div class="resumen-envio-header">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Secretaria</div>
        </div>
      </div>
    </div>

    <h2>Resumen de Envío</h2>
    <p class="resumen-envio-subtitle">
      Detalle de las citas enviadas al doctor.
    </p>

    <div class="resumen-doctor-box">
      <div class="resumen-doctor-avatar">👨‍⚕️</div>
      <div>
        <strong id="resumenDoctor">Dr. Doctor</strong>
        <span id="resumenEspecialidad">Especialidad</span>
      </div>
    </div>

    <div class="resumen-datos-box">
      <div>
        <span>📅 Fecha</span>
        <strong id="resumenFecha">Fecha</strong>
      </div>

      <div>
        <span>🗓️ Citas enviadas</span>
        <strong id="resumenCantidad">0 citas</strong>
      </div>

      <div>
        <span>⏱️ Enviado el</span>
        <strong id="resumenHoraEnvio">Hora</strong>
      </div>
    </div>

    <h3>Citas enviadas:</h3>

    <div id="listaResumenEnvio" class="lista-resumen-envio"></div>

    <button class="btn-resumen-menu" onclick="location.href='secretariaEnviarCitas.html'">
      Volver al Menú
    </button>

  </div>

  <div class="resumen-envio-footer">
    Resumen de envío
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
