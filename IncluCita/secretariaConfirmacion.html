<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmación de Acción</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="app container-fluid px-2 px-sm-3">

<section class="screen active">

  <div class="top">
    <div class="brand">
      <div class="logo">♡</div>
      <div>
        <div class="brand-title">IncluCita</div>
        <div class="brand-subtitle">Confirmación</div>
      </div>
    </div>
  </div>

  <div class="content">

  <div class="success-icon">
    ✓
  </div>

  <h2 style="color:#22c55e;">¡Acción realizada!</h2>

  <p style="text-align:center;color:#6b7280;font-weight:600;">
    La cita se ha reprogramado correctamente.
  </p>

  <div class="summary-card" style="margin-top:25px;">

    <h3 style="margin-top:0;color:#0f3f91;">
      Resumen de la acción
    </h3>

    <div class="summary-row">
      <strong>Paciente</strong>
      <span id="confPaciente"></span>
    </div>

    <div class="summary-row">
      <strong>Acción</strong>
      <span>Cita reprogramada</span>
    </div>

    <div class="summary-row">
      <strong>Nueva Fecha</strong>
      <span id="confFecha"></span>
    </div>

    <div class="summary-row">
      <strong>Nueva Hora</strong>
      <span id="confHora"></span>
    </div>

  </div>

  <button
    class="print-btn"
    style="margin-top:20px;"
    onclick="location.href='secretariaComprobante.html'">

    🖨 Imprimir comprobante

  </button>

  <button
    class="main-btn"
    style="width:100%;margin-top:15px;"
    onclick="location.href='secretariaCitas.html'">

    Volver al Menú

  </button>

</div>

  <div class="footer-note">
    La acción se realizó correctamente
  </div>

</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
