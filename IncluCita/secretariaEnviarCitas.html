<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IncluCita - Enviar Citas a Doctores</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="enviar-doctor-page">

  <div class="enviar-doctor-card">

    <div class="enviar-doctor-header">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Secretaria</div>
        </div>
      </div>

      <button class="back-btn-citas" onclick="location.href='secretariaMenu.html'">
        ← Volver
      </button>
    </div>

    <h1>Enviar Citas a Doctores</h1>
    <p class="enviar-subtitle">Seleccione el doctor al que desea enviar las citas.</p>

    <div class="doctor-search-box">
      <input
        type="text"
        id="buscarDoctorEnviar"
        placeholder="Buscar doctor por nombre o especialidad"
        oninput="buscarDoctorEnviarCitas()">
      <span>🔍</span>
    </div>

    <div id="listaDoctoresEnviar" class="lista-doctores-enviar"></div>

  </div>

  <div class="enviar-doctor-footer">
    Seleccione un doctor
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
