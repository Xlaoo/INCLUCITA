<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IncluCita - Mi Agenda</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="doctor-agenda-page">

  <div class="doctor-agenda-card">

    <div class="doctor-agenda-header">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Doctor</div>
        </div>
      </div>

      <button class="doctor-detalle-back" onclick="location.href='doctorMenu.html'">
        ← Volver al menú
      </button>
    </div>

    <h1>📅 Mi Agenda</h1>
    <p class="doctor-agenda-subtitle">
      Seleccione la fecha para ver su horario de consultorios y citas
    </p>

    <div class="doctor-agenda-content">

      <div class="agenda-calendar-box">
        <div class="agenda-calendar-header">
          <button onclick="cambiarMesAgenda(-1)">‹</button>
          <h2 id="agendaMesTexto">Junio 2026</h2>
          <button onclick="cambiarMesAgenda(1)">›</button>
        </div>

        <div class="agenda-weekdays">
          <span>Lun</span>
          <span>Mar</span>
          <span>Mié</span>
          <span>Jue</span>
          <span>Vie</span>
          <span>Sáb</span>
          <span>Dom</span>
        </div>

        <div id="agendaDias" class="agenda-days"></div>
      </div>

      <div class="agenda-selected-box">
        <p>Fecha seleccionada</p>

        <div class="agenda-date-icon">📅</div>

        <h2 id="agendaFechaSeleccionada">Seleccione un día</h2>
        <span id="agendaDiaSemana">---</span>

        <button class="btn-ver-agenda-dia" onclick="verAgendaDelDia()">
          Ver mi agenda del día
        </button>
      </div>

    </div>

    <div class="doctor-info-box agenda-info">
      <div class="doctor-info-icon">i</div>
      <div>
        Aquí puede ver su horario de consultorios y las citas programadas.
      </div>
    </div>

  </div>

  <div class="doctor-menu-footer">
    👆 Seleccione una fecha para revisar su agenda
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
