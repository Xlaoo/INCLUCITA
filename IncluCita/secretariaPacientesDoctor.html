<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacientes del Doctor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="pacientes-doctor-page container-fluid px-2 px-sm-3">
  <div class="pacientes-doctor-card">

    <div class="pacientes-doctor-header d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 gap-sm-3">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Doctor</div>
        </div>
      </div>

      <button class="back-btn-citas" onclick="location.href='secretariaMenu.html'">
        ← Salir
      </button>
    </div>

    <h1>Seleccionar Doctor</h1>
    <p class="pacientes-doctor-subtitle">
      Elige el doctor para ver sus pacientes de hoy.
    </p>

    <div class="doctor-search-box">
      <input
        type="text"
        id="buscarDoctorPaciente"
        placeholder="Buscar doctor por nombre o especialidad..."
        oninput="buscarDoctorPacientes()">
      <span>🔍</span>
    </div>

    <div id="listaDoctoresPacientes" class="lista-doctores-pacientes"></div>

  </div>

  <div class="pacientes-doctor-footer">
    👥 Selecciona un doctor para continuar
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
