<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IncluCita - Fecha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <section id="screen-date" class="screen active">
      <div class="top">
  <div class="brand">
    <div class="logo">♡</div>
    <div>
      <div class="brand-title">IncluCita</div>
      <div class="brand-subtitle">Plataforma de citas médica inclusiva</div>
    </div>
  </div>
</div>
      <div class="content">
        <div class="header-line">
          <button class="back-btn" onclick="goTo('screen-specialty')">← Volver</button>
        </div>

        <div class="step-bar">
          <div class="step">1</div><div class="line"></div>
          <div class="step active-step">2</div><div class="line"></div>
          <div class="step">3</div>
        </div>

        <h2>Seleccione la fecha disponible</h2>

       <div class="calendar">
  <div class="calendar-title">
      <span>‹</span>
      <span id="calendarMonthTitle">Mayo 2026</span>
      <span>›</span>
  </div>

  <div class="calendar-grid" id="calendarHeader">
      <div>LUN</div>
      <div>MAR</div>
      <div>MIÉ</div>
      <div>JUE</div>
      <div>VIE</div>
      <div>SÁB</div>
      <div>DOM</div>
  </div>

  <div class="calendar-grid" id="calendarDays"></div>
</div>

        <div class="legend">
  <div><span class="box free"></span> Libre</div>
  <div><span class="box partial"></span> Algunos horarios ocupados</div>
  <div><span class="box gray"></span> Sin disponibilidad</div>
</div>
      </div>

      <div class="footer-note">Seleccione un día con disponibilidad</div>
    </section>

</div>
<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
