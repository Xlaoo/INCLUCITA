<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IncluCita - Hora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <section id="screen-time" class="screen active">
      <div class="top">
  <div class="brand">
    <div class="logo">♡</div>
    <div>
      <div class="brand-title">IncluCita</div>
      <div class="brand-subtitle">Plataforma de citas médica inclusiva</div>
    </div>
  </div>
</div>
      <div class="content">
        <div class="header-line">
          <button class="back-btn" onclick="goTo('screen-date')">← Volver</button>
        </div>

        <div class="step-bar">
          <div class="step">1</div><div class="line"></div>
          <div class="step">2</div><div class="line"></div>
          <div class="step active-step">3</div>
        </div>

        <h2>Seleccione la hora disponible</h2>

        <div class="time-section">
          <strong>Mañana</strong>
          <div class="time-grid" id="morningSlots"></div>
        </div>

        <div class="time-section">
          <strong>Tarde</strong>
          <div class="time-grid" id="afternoonSlots"></div>
        </div>
        <div class="time-legend">
  <div><span class="legend-box available-box"></span> Disponible</div>
  <div><span class="legend-box occupied-box"></span> Ocupado</div>
</div>
      </div>

      <div class="footer-note">Toque la hora para continuar</div>
    </section>

</div>

<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
