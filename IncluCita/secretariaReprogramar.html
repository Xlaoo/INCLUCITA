<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reprogramar Cita</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="reprogramar-page">

  <div class="reprogramar-card">

    <div class="brand">
      <div class="logo">♡</div>
      <div>
        <div class="brand-title">IncluCita</div>
        <div class="brand-subtitle">Datos actuales de la cita</div>
      </div>
    </div>

    <div class="reprogramar-info">
      <p><strong>Paciente:</strong> <span id="repNombre"></span></p>
      <p><strong>Especialidad:</strong> <span id="repEspecialidad"></span></p>
      <p><strong>Médico:</strong> <span id="repDoctor"></span></p>
      <p><strong>Fecha actual:</strong> <span id="repFecha"></span></p>
      <p><strong>Hora actual:</strong> <span id="repHora"></span></p>
    </div>

    <label>Nueva Fecha</label>
    <select id="nuevaFechaRep" onchange="cargarHorasReprogramar()">
  <option value="">Seleccione nueva fecha</option>
</select>

    <label>Nueva Hora</label>
    <select id="nuevaHoraRep">
      <option value="">Seleccione nueva hora</option>
    </select>

    <label>Motivo opcional</label>
    <textarea id="motivoRep" placeholder="Ingrese el motivo de la reprogramación"></textarea>

    <div class="reprogramar-buttons">
      <button class="btn-volver-rep" onclick="location.href='secretariaDetalleCita.html'">
        Cancelar
      </button>

      <button class="btn-guardar-rep" onclick="guardarReprogramacion()">
        Guardar Cambios
      </button>
    </div>

  </div>

  <div class="reprogramar-footer">
    Seleccione la nueva fecha y hora
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
