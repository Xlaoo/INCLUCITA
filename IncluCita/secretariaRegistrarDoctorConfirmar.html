<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar Doctor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bootstrap-responsive">

<div class="registrar-doctor-page container-fluid px-2 px-sm-3">

  <div class="registrar-doctor-card">

    <div class="registrar-doctor-header d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 gap-sm-3">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Registrar Doctor</div>
        </div>
      </div>
    </div>

    <div class="registrar-step">
      <span class="done">✓</span>
      <div></div>
      <span class="done">✓</span>
      <div></div>
      <span class="done">✓</span>
      <div></div>
      <span class="active">4</span>
    </div>

    <h1>Confirmar y Guardar</h1>

    <div class="resumen-nuevo-doctor">

      <h3>Resumen del Nuevo Doctor</h3>

      <div class="fila-resumen">
        <span>👤 Nombre:</span>
        <strong id="confNuevoDoctorNombre"></strong>
      </div>

      <div class="fila-resumen">
        <span>🪪 DNI:</span>
        <strong id="confNuevoDoctorDni"></strong>
      </div>

      <div class="fila-resumen">
        <span>📞 Teléfono:</span>
        <strong id="confNuevoDoctorTelefono"></strong>
      </div>

      <div class="fila-resumen">
        <span>⚕️ Especialidad:</span>
        <strong id="confNuevoDoctorEspecialidad"></strong>
      </div>

      <div class="fila-resumen">
        <span>🏥 Consultorio:</span>
        <strong id="confNuevoDoctorConsultorio"></strong>
      </div>

      <div class="fila-resumen">
        <span>🕘 Horario:</span>
        <strong>
          <span id="confNuevoDoctorHorario"></span><br>
          <small id="confNuevoDoctorDias"></small>
        </strong>
      </div>

    </div>

    <div class="confirmar-info-ok">
      ✅ Verifique que la información sea correcta antes de guardar.
    </div>

    <div class="registro-doctor-buttons">
      <button onclick="location.href='secretariaRegistrarDoctorConsultorio.html'">
        ← Anterior
      </button>

      <button class="btn-guardar-final" onclick="guardarDoctorFinal()">
        💾 Guardar Doctor
      </button>
    </div>

  </div>

  <div class="registrar-doctor-footer">
    Confirme la información y guarde el nuevo doctor en el sistema
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
