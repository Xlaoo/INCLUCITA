<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancelar Cita</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="cancelar-page">

  <div class="cancelar-card">

    <div class="brand">
      <div class="logo">♡</div>
      <div>
        <div class="brand-title">IncluCita</div>
        <div class="brand-subtitle">Cancelar Cita</div>
      </div>
    </div>

    <button class="back-btn-citas"
      onclick="location.href='secretariaDetalleCita.html'">
      ← Volver
    </button>

    <div class="warning-box">
      ⚠️ Esta acción cancelará permanentemente la cita.
    </div>

    <h3 style="margin-top:20px;">¿Está seguro que desea cancelar?</h3>

    <div class="detalle-table">

      <div class="detalle-row">
        <strong>Paciente</strong>
        <span id="cancelNombre"></span>
      </div>

      <div class="detalle-row">
        <strong>Especialidad</strong>
        <span id="cancelEspecialidad"></span>
      </div>

      <div class="detalle-row">
        <strong>Médico</strong>
        <span id="cancelDoctor"></span>
      </div>

      <div class="detalle-row">
        <strong>Fecha</strong>
        <span id="cancelFecha"></span>
      </div>

      <div class="detalle-row">
        <strong>Hora</strong>
        <span id="cancelHora"></span>
      </div>

    </div>

    <label>Motivo de cancelación</label>

    <select id="motivoCancelacion" class="cancel-input">
      <option value="">Seleccione un motivo</option>
      <option>Paciente no asistirá</option>
      <option>Error en la reserva</option>
      <option>Reprogramación posterior</option>
      <option>Otro motivo</option>
    </select>

    <label>Observación (opcional)</label>

    <textarea
      id="observacionCancelacion"
      class="cancel-textarea"
      placeholder="Ingrese una observación adicional"></textarea>

    <div class="cancel-buttons">

      <button
        class="btn-volver-rep"
        onclick="location.href='secretariaDetalleCita.html'">

        No cancelar

      </button>

      <button
        class="btn-cancelar-final"
        onclick="confirmarCancelacionSecretaria()">

        Confirmar Cancelación

      </button>

    </div>

  </div>
    <div class="cancelar-footer">
    Confirme el motivo para cancelar la cita
  </div>


</div>

<script src="script.js"></script>

</body>
</html>
