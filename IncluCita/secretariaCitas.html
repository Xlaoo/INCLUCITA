<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IncluCita - Gestión de Citas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="secretaria-citas-page">

  <div class="secretaria-citas-card">

    <div class="secretaria-citas-header">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Citas</div>
        </div>
      </div>
    </div>

    <button class="back-btn-citas" onclick="location.href='secretariaMenu.html'">
      ← Volver
    </button>

    <h1>Gestión de Citas</h1>
    <p class="citas-subtitle">Busque al paciente para ver sus citas</p>

    <label class="citas-label">Buscar por DNI o nombre</label>

    <div class="citas-search-box">
      <input
        type="text"
        id="buscarCitaInput"
        placeholder="Ingrese DNI o nombre del paciente"
        oninput="buscarCitasSecretaria()">
      <span>🔍</span>
    </div>

    <div class="citas-tabs">
      <button id="tabTodas" class="active-tab" onclick="filtrarCitasSecretaria('todas')">Todas</button>
      <button id="tabHoy" onclick="filtrarCitasSecretaria('hoy')">Hoy</button>
      <button id="tabProximas" onclick="filtrarCitasSecretaria('proximas')">Próximas</button>
    </div>

    <div id="citasList" class="citas-list"></div>

    <div class="citas-bottom">
      <span id="citasInfo">Mostrando citas</span>
      <div id="citasPagination" class="pagination"></div>
    </div>

  </div>

  <div class="secretaria-citas-footer">
    Seleccione una cita para ver más opciones
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
