<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IncluCita - Confirmar cita</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <section id="screen-confirm" class="screen active">
      <div class="top">
  <div class="brand">
    <div class="logo">♡</div>
    <div>
      <div class="brand-title">IncluCita</div>
      <div class="brand-subtitle">Plataforma de citas médica inclusiva</div>
    </div>
  </div>
</div>
      <div class="content">
        <div class="header-line">
          <button class="back-btn" onclick="goTo('screen-time')">← Volver</button>
          <strong>Confirme los datos de su cita</strong>
        </div>

        <div class="summary-card">
          <div class="summary-row">
            <div class="summary-icon">👤</div>
            <strong>Paciente</strong>
            <span id="confirmPatient"></span>
          </div>

          <div class="summary-row">
            <div class="summary-icon">🩺</div>
            <strong>Especialidad</strong>
            <span id="confirmSpecialty"></span>
          </div>

          <div class="summary-row">
            <div class="summary-icon" id="doctorIcon">🩺</div>
            <strong>Médico</strong>
            <span id="confirmDoctor"></span>
          </div>

          <div class="summary-row">
            <div class="summary-icon">🏥</div>
            <strong>Consultorio</strong>
            <span id="confirmConsultorio"></span>
          </div>

          <div class="summary-row">
            <div class="summary-icon">📅</div>
            <strong>Fecha</strong>
            <span id="confirmDate"></span>
          </div>

          <div class="summary-row">
            <div class="summary-icon">🕘</div>
            <strong>Hora</strong>
            <span id="confirmTime"></span>
          </div>
        </div>

        <div class="actions">
          <button class="secondary-btn" onclick="goTo('screen-time')">← Volver</button>
          <button class="main-btn" onclick="confirmAppointment()">✓ Confirmar cita</button>
        </div>
      </div>
      <div class="footer-note">Verifique que los datos sean correctos</div>
    </section>

</div>

<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
