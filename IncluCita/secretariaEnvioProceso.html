<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviando Citas</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="envio-proceso-page">

  <div class="envio-proceso-card">

    <div class="brand">
      <div class="logo">♡</div>
      <div>
        <div class="brand-title">IncluCita</div>
        <div class="brand-subtitle">Secretaria</div>
      </div>
    </div>

    <div id="pantallaEnviando" class="proceso-box">
      <div class="paper-plane-css">
  <div class="plane-body"></div>
  <div class="plane-wing wing-left"></div>
  <div class="plane-wing wing-right"></div>
  <div class="plane-tail"></div>
</div>

      <h2>Enviando citas al doctor</h2>
      <p>Por favor espere un momento...</p>

      <div class="progress-box">
        <div id="barraEnvio" class="progress-fill"></div>
      </div>

      <strong id="porcentajeEnvio">0%</strong>
    </div>

    <div id="pantallaCompletado" class="proceso-box oculto">
      <div class="success-envio-icon">✓</div>

      <h2>¡Citas enviadas con éxito!</h2>
      <p>Las citas han sido enviadas correctamente al doctor.</p>

      <div class="resumen-envio-final">
        <div><strong>Doctor</strong><span id="finalDoctor">Doctor</span></div>
        <div><strong>Fecha</strong><span id="finalFecha">Fecha</span></div>
        <div><strong>Citas enviadas</strong><span id="finalCantidad">0 citas</span></div>
        <div><strong>Enviado el</strong><span id="finalHoraEnvio">Ahora</span></div>
      </div>

      <button class="btn-ver-resumen" onclick="location.href='secretariaResumenEnvio.html'">
        Ver Resumen
      </button>
    </div>

  </div>

  <div id="footerProceso" class="envio-proceso-footer">
    Enviando información...
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
