<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seleccionar Fecha</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="pacientes-doctor-fecha-page">

  <div class="pacientes-doctor-fecha-card">

    <div class="pacientes-doctor-header">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Doctor</div>
        </div>
      </div>

      <button class="back-btn-citas" onclick="location.href='secretariaPacientesDoctor.html'">
        ← Salir
      </button>
    </div>

    <h1>Seleccionar Fecha</h1>

    <p class="pacientes-doctor-subtitle">
      Elige la fecha para ver las citas del doctor
    </p>

    <h3 id="doctorFechaNombre">Dr. Doctor</h3>
    <p id="doctorFechaEspecialidad" class="doctor-fecha-especialidad">Especialidad</p>

    <div class="doctor-calendar-box">

      <div class="doctor-calendar-title">
        <span>‹</span>
        <strong id="doctorCalendarTitulo">Mes Año</strong>
        <span>›</span>
      </div>

      <div class="doctor-calendar-week">
        <span>Lun</span>
        <span>Mar</span>
        <span>Mié</span>
        <span>Jue</span>
        <span>Vie</span>
        <span>Sáb</span>
        <span>Dom</span>
      </div>

      <div id="doctorCalendarDays" class="doctor-calendar-days"></div>

      <div class="doctor-calendar-legend">
        <span><b></b> Hoy</span>
      </div>

    </div>

  </div>

  <div class="pacientes-doctor-fecha-footer">
    📅 Selecciona una fecha
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
