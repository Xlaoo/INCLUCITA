<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle del Paciente</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="detalle-paciente-page">

  <div class="detalle-paciente-card">

    <div class="detalle-paciente-header">
      <div class="brand">
        <div class="logo">♡</div>
        <div>
          <div class="brand-title">IncluCita</div>
          <div class="brand-subtitle">Detalles del Paciente</div>
        </div>
      </div>

      <button class="back-btn-citas" onclick="location.href='secretariaPacientes.html'">
        ← Volver
      </button>
    </div>

    <div class="detalle-paciente-info">

      <div class="detalle-row">
        <span>👤 Paciente</span>
        <strong id="pacDetalleNombre">Paciente</strong>
      </div>

      <div class="detalle-row">
        <span>🪪 DNI</span>
        <strong id="pacDetalleDni">DNI</strong>
      </div>

      <div class="detalle-row">
        <span>🏥 Especialidad</span>
        <strong id="pacDetalleEspecialidad">Especialidad</strong>
      </div>

      <div class="detalle-row">
        <span>👨‍⚕️ Médico</span>
        <strong id="pacDetalleMedico">Médico</strong>
      </div>

      <div class="detalle-row">
        <span>📅 Fecha</span>
        <strong id="pacDetalleFecha">Fecha</strong>
      </div>

      <div class="detalle-row">
        <span>🕘 Hora</span>
        <strong id="pacDetalleHora">Hora</strong>
      </div>

      <div class="detalle-row">
        <span>✅ Estado</span>
        <strong id="pacDetalleEstado" class="estado-confirmada">Confirmada</strong>
      </div>

    </div>

  </div>

  <div class="detalle-paciente-footer">
    Verifique los datos del paciente
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
